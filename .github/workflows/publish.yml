name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: userscript-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

      - name: Compute artifact version
        id: version
        run: echo "value=$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: node tooling/build-userscript.mjs --version-override "${{ steps.version.outputs.value }}"

      - name: Stage GitHub Pages
        env:
          ARTIFACT_VERSION: ${{ steps.version.outputs.value }}
        run: node tooling/stage-pages.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      # deploy-pages occasionally runs before the freshly uploaded artifact is
      # readable through the API and then fails with "No artifacts found".
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 20); do
            count="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo 0)"
            if [ "${count:-0}" -ge 1 ]; then
              echo "github-pages artifact visible after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 3
          done
          echo "github-pages artifact never became visible" >&2
          exit 1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish media asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view userscripts-assets >/dev/null 2>&1; then
            gh release create userscripts-assets --title "Userscript assets" --notes "Media assets for GeoGuessr Toolkit userscripts."
          fi
          tmpdir="$(mktemp -d)"
          if gh release download userscripts-assets -p brainrot.mp4 -D "$tmpdir" >/dev/null 2>&1; then
            if cmp -s "$tmpdir/brainrot.mp4" assets/geosurfer/brainrot.mp4; then
              echo "brainrot.mp4 is unchanged; skipping asset upload."
              exit 0
            fi
          fi
          gh release upload userscripts-assets assets/geosurfer/brainrot.mp4 --clobber
